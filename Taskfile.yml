version: '3'

vars:
  APP_NAME: "dynamic-db-admin"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  build:
    desc: Build the application for the current platform
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    desc: Package the application for the current platform
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    desc: Run the built application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    desc: Run the Wails v3 application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  test:
    desc: Run Go tests
    cmds:
      - go test ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  frontend:install:
    desc: Install frontend dependencies
    dir: frontend
    cmds:
      - npm install

  frontend:type-check:
    desc: Type-check the Vue frontend
    dir: frontend
    cmds:
      - npm run type-check

  frontend:build:
    desc: Build the Vue frontend
    dir: frontend
    cmds:
      - npm run build

  check:
    desc: Run Go and frontend checks
    cmds:
      - task: vet
      - task: test
      - task: frontend:type-check
      - task: frontend:build
