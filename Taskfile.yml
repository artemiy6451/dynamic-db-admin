version: '3'

vars:
  VITE_PORT: '{{.WAILS_VITE_PORT | default "9245"}}'

tasks:
  dev:
    desc: Run the Wails v3 application in development mode
    cmds:
      - wails3 dev

  build:
    desc: Build the desktop application for the current platform
    cmds:
      - wails3 build

  bindings:
    desc: Regenerate Wails v3 frontend bindings
    cmds:
      - wails3 generate bindings

  test:
    desc: Run Go tests
    cmds:
      - go test ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  frontend:install:
    desc: Install frontend dependencies
    dir: frontend
    cmds:
      - npm install

  frontend:type-check:
    desc: Type-check the Vue frontend
    dir: frontend
    cmds:
      - npm run type-check

  frontend:build:
    desc: Build the Vue frontend
    dir: frontend
    cmds:
      - npm run build

  check:
    desc: Run Go and frontend checks
    cmds:
      - task: vet
      - task: test
      - task: frontend:type-check
      - task: frontend:build
