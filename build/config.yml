version: '3'

info:
  companyName: "Dynamic DB Admin"
  productName: "Dynamic DB Admin"
  productIdentifier: "dev.lokach.dynamicdbadmin"
  description: "Desktop application for visual SQLite database management"
  copyright: "Copyright 2026 Lokach"
  comments: "SQLite database administration and design"
  version: "0.0.1"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown
